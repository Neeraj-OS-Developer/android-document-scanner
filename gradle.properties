# ============================================================
# Project-wide Gradle settings
# ============================================================
# IDE users: IDE ke Gradle settings is file ko override kar sakte hain.
# Documentation: https://docs.gradle.org/current/userguide/build_environment.html
# ============================================================

# ------------------------------------------------------------
# JVM / Memory
# ------------------------------------------------------------
# AGP 8.9 + Gradle 8.13 ke saath 2 GB kam pad sakta hai.
# 4 GB safe hai modern machines pe. CI pe bhi theek chalega.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ------------------------------------------------------------
# Build performance
# ------------------------------------------------------------
# Parallel build — multi-module project (documentscanner + documentscanner-demo)
org.gradle.parallel=true

# Build cache — dobara build tez hoga (CI + local)
org.gradle.caching=true

# Configuration cache — Gradle 8.13 me stable hai, par kuch purane plugins
# tod sakte hain. Pehle false rakhо, sab chal jaye to true karke test karo.
# org.gradle.configuration-cache=true

# Daemon — CI pe issue kare to false karo, warna true hi rehne do
org.gradle.daemon=true

# ------------------------------------------------------------
# AndroidX
# ------------------------------------------------------------
# AndroidX packages mandatory — bina iske androidx.core:core-ktx resolve nahi hoga
android.useAndroidX=true

# Jetifier OFF — project already AndroidX hai, isliye OFF rakho (build fast)
# Agar koi purani support library dependency aaye to temporarily true karo
android.enableJetifier=false

# Non-transitive R class — AGP 8 ka recommended default
android.nonTransitiveRClass=true

# ------------------------------------------------------------
# Kotlin
# ------------------------------------------------------------
# Official Kotlin coding style
kotlin.code.style=official

# ------------------------------------------------------------
# Android build features defaults (optional, par useful)
# ------------------------------------------------------------
# BuildConfig generate karo — sirf agar library me use ho raha ho
android.defaults.buildfeatures.buildconfig=true

# ViewBinding / DataBinding use kar rahe ho to enabled karo, warna nahi:
# android.defaults.buildfeatures.viewbinding=true

# ------------------------------------------------------------
# Lint
# ------------------------------------------------------------
# Lint ko build ke saath block na karo — alag se chalao
# (CI me :documentscanner:lint task separately chala sakte ho)
android.lint.checkReleaseBuilds=false
android.lint.abortOnError=true
