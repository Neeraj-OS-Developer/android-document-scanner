# ============================================================
# Workflow: Build Library AAR + Demo APK
# Triggers: manual, push to main/master, PR, tag
# Outputs: AAR (library), APK (demo app) as artifacts + release assets
# ============================================================

name: Build AAR and Demo APK

on:
  # Manual trigger — Actions tab se "Run workflow" button
  workflow_dispatch:

  # Auto trigger on push to main/master
  push:
    branches: [ main, master ]
    tags:
      - 'v*'   # tag push -> release banega

  # PR pe bhi build chalao (verify karne ke liye)
  pull_request:
    branches: [ main, master ]

# Minimal permissions — release attach karne ke liye write
permissions:
  contents: write

# Ek waqt me ek hi build — overlapping se bachne ke liye
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build library + demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------- 1. Code checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. JDK 17 setup (AGP 8.9+ ke liye mandatory) ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ---------- 3. gradlew executable banao ----------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- 4. Environment info (debug ke liye useful) ----------
      - name: Print environment info
        run: |
          echo "Java version:"
          java -version
          echo ""
          echo "Gradle version:"
          ./gradlew --version
          echo ""
          echo "Available projects:"
          ./gradlew projects

      # ---------- 5. Library AAR build ----------
      - name: Build library AAR
        run: |
          ./gradlew :documentscanner:clean \
                    :documentscanner:assembleRelease \
                    --stacktrace \
                    --no-daemon

      # ---------- 6. Demo APK build ----------
      - name: Build demo APK
        run: |
          ./gradlew :documentscanner-demo:assembleRelease \
                    --stacktrace \
                    --no-daemon

      # ---------- 7. AAR locate karo ----------
      - name: Find AAR
        id: find_aar
        if: success()
        run: |
          AAR_PATH=$(find documentscanner/build/outputs/aar -name "*-release.aar" -type f | head -n1)
          if [ -z "$AAR_PATH" ]; then
            echo "❌ AAR nahi mila — build fail ho gaya ya path alag hai"
            echo "Search results:"
            find . -name "*.aar" -type f || true
            exit 1
          fi
          AAR_NAME=$(basename "$AAR_PATH")
          AAR_SIZE=$(du -h "$AAR_PATH" | cut -f1)
          echo "✅ AAR mila: $AAR_PATH ($AAR_SIZE)"
          echo "path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$AAR_NAME" >> "$GITHUB_OUTPUT"

      # ---------- 8. Demo APK locate karo ----------
      - name: Find demo APK
        id: find_apk
        if: success()
        run: |
          APK_PATH=$(find documentscanner-demo/build/outputs/apk/release -name "*.apk" -type f | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK nahi mila — demo build fail ho gaya"
            echo "Search results:"
            find . -name "*.apk" -type f || true
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK mila: $APK_PATH ($APK_SIZE)"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      # ---------- 9. Artifacts upload (AAR + APK) ----------
      - name: Upload AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentscanner-aar
          path: ${{ steps.find_aar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload demo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentscanner-demo-apk
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ---------- 10. Build summary (Actions UI me dikhega) ----------
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|------|" >> "$GITHUB_STEP_SUMMARY"
          AAR_SIZE=$(du -h "${{ steps.find_aar.outputs.path }}" | cut -f1)
          APK_SIZE=$(du -h "${{ steps.find_apk.outputs.path }}" | cut -f1)
          echo "| Library AAR | ${{ steps.find_aar.outputs.name }} | $AAR_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Demo APK | ${{ steps.find_apk.outputs.name }} | $APK_SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts neeche download section me available hain." >> "$GITHUB_STEP_SUMMARY"

      # ---------- 11. GitHub Release (sirf tag push pe) ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.find_aar.outputs.path }}
            ${{ steps.find_apk.outputs.path }}
          body: |
            ## Release ${{ github.ref_name }}

            ### Artifacts
            - **Library AAR**: `${{ steps.find_aar.outputs.name }}`
            - **Demo APK**: `${{ steps.find_apk.outputs.name }}`

            ### Install
            ```bash
            adb install ${{ steps.find_apk.outputs.name }}
            ```
