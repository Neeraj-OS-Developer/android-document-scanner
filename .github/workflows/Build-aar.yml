name: Build AAR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write   # release attach karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAR
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Find AAR
        id: aar
        run: |
          AAR_PATH=$(find . -path "*/outputs/aar/*-release.aar" | head -n1)
          if [ -z "$AAR_PATH" ]; then
            echo "AAR nahi mila! Library module check karo."
            exit 1
          fi
          echo "path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$AAR_PATH")" >> "$GITHUB_OUTPUT"
          echo "Found: $AAR_PATH"

      - name: Upload AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aar
          path: ${{ steps.aar.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release (sirf tag pe)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.aar.outputs.path }}
