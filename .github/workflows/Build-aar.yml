# ============================================================
# Workflow: Build Library AAR + Demo Debug/Release APKs
# Triggers: manual, push to main/master, PR, tag
# Outputs:
#   - Library AAR (release)
#   - Demo Debug APK (auto-signed, installable)
#   - Demo Release APK (unsigned)
# ============================================================

name: Build AAR and Demo APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AAR + Debug/Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------- 1. Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ---------- 3. gradlew executable ----------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- 4. Environment info ----------
      - name: Print environment info
        run: |
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Gradle ==="
          ./gradlew --version
          echo ""
          echo "=== Projects ==="
          ./gradlew projects

      # ---------- 5. Library AAR (release) ----------
      - name: Build library AAR (release)
        run: |
          ./gradlew :documentscanner:clean \
                    :documentscanner:assembleRelease \
                    --stacktrace --no-daemon

      # ---------- 6. Demo DEBUG APK (auto-signed, installable) ----------
      - name: Build demo APK (debug)
        run: |
          ./gradlew :documentscanner-demo:assembleDebug \
                    --stacktrace --no-daemon

      # ---------- 7. Demo RELEASE APK (unsigned) ----------
      - name: Build demo APK (release)
        run: |
          ./gradlew :documentscanner-demo:assembleRelease \
                    --stacktrace --no-daemon

      # ---------- 8. Locate AAR ----------
      - name: Find AAR
        id: find_aar
        run: |
          AAR_PATH=$(find documentscanner/build/outputs/aar -name "*-release.aar" -type f | head -n1)
          if [ -z "$AAR_PATH" ]; then
            echo "❌ AAR nahi mila"; find . -name "*.aar" || true; exit 1
          fi
          echo "✅ AAR: $AAR_PATH"
          echo "path=$AAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$AAR_PATH")" >> "$GITHUB_OUTPUT"

      # ---------- 9. Locate DEBUG APK ----------
      - name: Find debug APK
        id: find_debug_apk
        run: |
          APK_PATH=$(find documentscanner-demo/build/outputs/apk/debug -name "*.apk" -type f | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Debug APK nahi mila"; find . -name "*.apk" || true; exit 1
          fi
          # Rename so it's clear in downloads
          OUT="dist/documentscanner-demo-debug.apk"
          mkdir -p dist
          cp "$APK_PATH" "$OUT"
          echo "✅ Debug APK: $OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      # ---------- 10. Locate RELEASE APK ----------
      - name: Find release APK
        id: find_release_apk
        run: |
          APK_PATH=$(find documentscanner-demo/build/outputs/apk/release -name "*.apk" -type f | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Release APK nahi mila"; find . -name "*.apk" || true; exit 1
          fi
          OUT="dist/documentscanner-demo-release-unsigned.apk"
          mkdir -p dist
          cp "$APK_PATH" "$OUT"
          echo "✅ Release APK: $OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      # ---------- 11. Verify signatures ----------
      - name: Verify APK signatures
        run: |
          echo "=== Debug APK signature check ==="
          if [ -f "${{ steps.find_debug_apk.outputs.path }}" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "${{ steps.find_debug_apk.outputs.path }}" || echo "apksigner check failed"
            else
              echo "apksigner not found, skipping"
            fi
          fi
          echo ""
          echo "=== Release APK signature check ==="
          if [ -f "${{ steps.find_release_apk.outputs.path }}" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify "${{ steps.find_release_apk.outputs.path }}" || echo "Release APK is UNSIGNED (expected)"
            fi
          fi

      # ---------- 12. Upload artifacts ----------
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: documentscanner-aar
          path: ${{ steps.find_aar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: documentscanner-demo-debug-apk
          path: ${{ steps.find_debug_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: documentscanner-demo-release-apk-unsigned
          path: ${{ steps.find_release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ---------- 13. Build summary ----------
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | File | Size | Note |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|------|------|" >> "$GITHUB_STEP_SUMMARY"
          AAR_SIZE=$(du -h "${{ steps.find_aar.outputs.path }}" | cut -f1)
          DBG_SIZE=$(du -h "${{ steps.find_debug_apk.outputs.path }}" | cut -f1)
          REL_SIZE=$(du -h "${{ steps.find_release_apk.outputs.path }}" | cut -f1)
          echo "| AAR | ${{ steps.find_aar.outputs.name }} | $AAR_SIZE | Library distribution |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Debug APK | ${{ steps.find_debug_apk.outputs.name }} | $DBG_SIZE | ✅ Installable (auto-signed) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release APK | ${{ steps.find_release_apk.outputs.name }} | $REL_SIZE | ❌ Unsigned (needs signing) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Install karne ke liye Debug APK use karo:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "adb install documentscanner-demo-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---------- 14. Release (sirf tag push pe) ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ${{ steps.find_aar.outputs.path }}
            ${{ steps.find_debug_apk.outputs.path }}
            ${{ steps.find_release_apk.outputs.path }}
          body: |
            ## Release ${{ github.ref_name }}

            ### Artifacts
            - **AAR**: `${{ steps.find_aar.outputs.name }}`
            - **Debug APK** (installable): `${{ steps.find_debug_apk.outputs.name }}`
            - **Release APK** (unsigned): `${{ steps.find_release_apk.outputs.name }}`

            ### Install (debug)
            ```bash
            adb install ${{ steps.find_debug_apk.outputs.name }}
            ```
